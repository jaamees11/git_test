name: AI Pulse — weekly Prompt Pack (paid tier)

on:
  schedule:
    # Fridays 14:00 UTC
    - cron: "0 14 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip Beehiiv publish (preview only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate prompt pack
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m pipeline.prompt_pack --dry-run
          else
            python -m pipeline.prompt_pack
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-pack-${{ github.run_id }}
          path: .cache/prompt-pack-*.*
          retention-days: 14
