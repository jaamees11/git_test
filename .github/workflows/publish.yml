name: AI Pulse — build & publish draft

on:
  schedule:
    # 06:30 UTC daily (tweak to your timezone)
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing to Beehiiv (preview only)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m pipeline.run --dry-run
          else
            python -m pipeline.run
          fi

      - name: Upload issue preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-issue-${{ github.run_id }}
          path: .cache/issue-*.*
          retention-days: 14
