name: AI Pulse — build & publish draft

on:
  schedule:
    # 06:30 UTC daily (tweak to your timezone)
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing to Beehiiv (preview only)"
        required: false
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
      BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      SUBSCRIBE_URL: ${{ vars.SUBSCRIBE_URL }}
      TWITTER_HANDLE: ${{ vars.TWITTER_HANDLE }}
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull the gh-pages-archive branch so the manifest carries forward.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore archive from gh-pages branch (if exists)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git worktree add /tmp/pages-tree origin/gh-pages || true
            mkdir -p site
            cp -r /tmp/pages-tree/* site/ 2>/dev/null || true
            cp /tmp/pages-tree/.nojekyll site/.nojekyll 2>/dev/null || true
          else
            echo "No existing gh-pages branch — first run."
          fi

      - name: Run pipeline
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m pipeline.run --dry-run
          else
            python -m pipeline.run
          fi

      - name: Upload issue preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-pulse-issue-${{ github.run_id }}
          path: |
            .cache/issue-*.*
            .cache/share-*.md
          retention-days: 14

      - name: Upload Pages artifact
        if: env.SITE_URL != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
